<div class="bg-dark min-vh-100 py-4">
  <div class="container">

    <h1 class="text-center text-warning fw-bold mb-4">
      LISTA DE PERSONAJES DE STAR WARS
    </h1>

    <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4">
      @for (cha of characterList(); track cha.name) {
        <div class="col">
          <app-character-item-component
            [character]="cha"
            (characterClicked)="openCharacterModal($event)" />
        </div>
      }
    </div>

  </div>
</div>
