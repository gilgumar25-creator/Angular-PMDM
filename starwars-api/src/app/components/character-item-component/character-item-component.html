<section class="card" style="max-width: 320px">
    <div class="card-body">
        <h4 class="card-title">{{character()?.name}}</h4>
        <p class="card-text">({{character()?.url}})</p>
        <button type="button" class="btn-solid theme-primary" (click)="emitCharacterClicked()">View detail</button>
    </div>
</section>
